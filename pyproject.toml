[project]
name = "model-lab"
version = "0.1.0"
description = "Cost-per-passed-task model evaluation with cross-family graders, plus a small email-triage LoRA study"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E401", "E501", "E701", "E702", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
