[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-lab"
version = "1.0.0"
description = "Cost-per-passed-task model evaluation with cross-family graders, plus a small email-triage LoRA study"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["modellab", "email_triage"]

[tool.ruff]
line-length = 120
target-version = "py311"
# vendored third-party tooling is not linted as project code
extend-exclude = [".claude", ".git-signoff"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
