name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "40 13 * * 1"   # weekly: catch dependency drift
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest ruff
      - run: ruff check .
      - run: python -m pytest -q   # offline; no network, no model downloads
