name: git-signoff notes

# Rebuilds refs/notes/signoff from attestation commits — in main's
# history and in the heads of merged pull requests from this repository — and
# pushes it. Interviews run in cloud sessions cannot push notes themselves; this
# is what lets a squash- or rebase-merged branch's attestation survive.

on:
  push:
    branches: [ main ]
    # Same code paths as verify-signoff: only code merges carry attestations.
    # Without this, pushes with no attestation fail (recover tries to push a
    # refs/notes/signoff that was never created).
    paths:
      - 'modellab/**'
      - 'email_triage/**'
      - '**.py'
      - '!.claude/**'
      - '!.github/**'
      - '!.git-signoff/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  recover-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jerrylin96/git-signoff/recover@c8928804f9cf6eb659e54b7e686fbc4c0faa626f # verify-v1.7
        with:
          branch: main
